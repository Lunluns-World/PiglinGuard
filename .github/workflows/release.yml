name: Release

# Push a tag like v1.0.1 to publish a release. The tag must match `version` in build.gradle.kts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches project version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts"
            exit 1
          fi
      - name: Build and test
        run: ./gradlew build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/PiglinGuard-*.jar --title "$GITHUB_REF_NAME" --generate-notes
